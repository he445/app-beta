# Tolerâncias da suíte de conformidade (docs/testes/conformidade.md). Valem para qualquer implementação.
version: 1
measures:
  skew:
    # A medida de skew é |ângulo| em graus; o sinal fica em correction.params.skew_deg.
    field: correction.params.skew_deg
    expected: params.angle_deg
    abs: 0.1
  low_resolution:
    field: measure
    expected: params.dpi
    abs: 0.5
  black_borders:
    field: measure
    expected: params.fraction
    rel: 0.02
# Regras extras aceitas no mesmo alvo de um defeito esperado, com a justificativa.
co_occurrence:
  blur: [exposure]            # desfoque reduz o contraste papel-tinta medido
  low_resolution: [exposure]  # reamostragem para 150-200 dpi suaviza os traços
# Regras extras aceitas no alvo de um defeito esperado cuja regra o perfil desliga.
when_disabled:
  duplicate_page: [numbering_review]  # sem a regra de duplicata, a cópia repete a numeração
