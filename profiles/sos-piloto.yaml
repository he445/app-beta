# Perfil do piloto: todas as regras ligadas, com os ajustes de cada digitalizadora.
# Ordem de aplicação de cada parâmetro: padrão do manifesto da regra → "detectors" deste
# perfil → "overrides" da estação da página. A estação é reconhecida pelo fabricante e
# modelo gravados no arquivo; sem isso, vale a estação padrão do computador.
# Os valores por estação são ponto de partida conservador (na dúvida, a página vai para
# revisão) e são calibrados com as confirmações dos garantidores.
# Validado contra contracts/schemas/profile.schema.json.
id: sos-piloto
name: Piloto SOS DOCS — Campo Grande
organization: SOS DOCS
resolution:
  min_dpi: 300
verdict:
  max_yellow_ratio: 0.02
  green_sample_ratio: 0.05
numbering:
  enabled: true
  mode: simple                 # recto_verso quando o verso não é numerado
  min_confidence: 0.5
  high_confidence: 0.85
  regions:                     # frações da página já orientada: [x0, y0, x1, y1]
    - [0.60, 0.00, 1.00, 0.18] # canto superior direito
  struck_threshold: 0.6
  recognizer: ppocrv5-mobile-rec
feedback:                      # coleta do beta, só nesta máquina (aval de LGPD antes do piloto)
  enabled: true
  retention_days: 180
identifier_pattern: "{batch}-{document}"
stations:
  - id: cg-e3
    make: Kodak
    model: i4250
    location: "Unidade Campo Grande, Estação 3"
    overrides:
      black_borders: { params: { dark_level: 60 } }
      exposure: { params: { reference_paper: 235 } }
  - id: centro-e1
    make: Kodak
    model: S2085f
    location: "Unidade Centro, Estação 1"
    overrides:
      duplicate_page: { enabled: false }
detectors:
  orientation: { params: { auto_threshold: 0.90, review_threshold: 0.60 } }
  black_borders: { enabled: true }
  exposure: { enabled: true }
  low_resolution: { enabled: true, params: { min_dpi: 300 } }
  duplicate_page: { enabled: true }
  blank_page:
    params: { remove_blank_pages: true }
