openapi: 3.1.0
info:
  title: QA Automático de Digitalização — API do motor
  version: 0.16.0
  summary: Contrato entre a interface web, a linha de comando e o motor de análise.
  description: |
    Fonte da verdade do sistema (ADR-0002). Modelos de cada linguagem são gerados a partir
    deste arquivo e dos esquemas em `schemas/`, ou validados contra eles.

    Unidades: pixels com origem no canto superior esquerdo, ângulos em graus (positivo =
    horário), resolução em dpi, datas ISO 8601 UTC.

    Na PoC o motor só recebe lotes sintéticos ou públicos e apaga cada lote 24 horas após
    o envio.
  license:
    name: Proprietária
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local
security:
  - bearer: []
tags:
  - name: batches
    description: Envio, progresso e resultado de lotes
  - name: review
    description: Decisões do revisor
  - name: pages
    description: Imagens e numeração
  - name: corrections
    description: Correção em lote ("Corrigir tudo") e lote corrigido para baixar
  - name: profiles
    description: Perfis de cliente
  - name: system
    description: Saúde do serviço, sessão e configuração
  - name: reports
    description: Relatório por caixa (pendências de cada processo) e o que a Gestão lê
  - name: admin
    description: Diagnóstico, só com token de administrador (cabeçalho X-Admin-Token)
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Saúde do serviço
      security: []
      description: |
        Público. A interface consulta esta rota ao abrir: espera o motor acordar (no plano
        gratuito do Render leva até 1 minuto), descobre se precisa pedir token
        (`auth_required`) e, por `mode` e `capabilities`, o que mostrar. O mesmo build da
        interface serve a nuvem, o programa desktop e o servidor interno.
      responses:
        "200":
          description: Serviço no ar
          content:
            application/json:
              schema: { $ref: "schemas/health.schema.json" }
  /settings:
    get:
      tags: [system]
      operationId: getSettings
      summary: Configuração deste computador, com a origem de cada valor
      description: Só no programa desktop (`settings` em `capabilities`).
      responses:
        "200":
          description: Configuração efetiva
          content:
            application/json:
              schema: { $ref: "schemas/settings-view.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [system]
      operationId: putSettings
      summary: Mudar a configuração do usuário
      description: |
        Valida cada chave contra `settings.schema.json` e só então grava no arquivo do
        usuário. Chave travada pelo arquivo da máquina ou valor inválido: 422 com a lista
        `problems` (chave, origem e valor esperado), e nada é gravado. As mudanças valem
        na próxima abertura do programa (`restart_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/settings-update.schema.json" }
      responses:
        "200":
          description: Configuração depois da mudança
          content:
            application/json:
              schema: { $ref: "schemas/settings-view.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /diagnostics/client-errors:
    post:
      tags: [system]
      operationId: reportClientError
      summary: Registrar um erro da interface
      description: Erros de tela e de JavaScript vão para o diagnóstico, sem imagem nem texto de documento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/client-error.schema.json" }
      responses:
        "204": { description: Registrado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/diagnostics:
    get:
      tags: [admin]
      operationId: listDiagnostics
      summary: Cartões, erros por dia e erros agrupados por assinatura
      description: |
        Junta os registros deste computador e, com `diagnostics_dir`, os de todas as máquinas.
        Sem token de administrador configurado: 404. Token errado: 401; cinco erros seguidos
        bloqueiam por um minuto (429).
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
        - { name: version, in: query, schema: { type: string } }
        - { name: machine, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { enum: [critical, error, warning] } }
        - { name: origin, in: query, schema: { enum: [engine, worker, startup, client] } }
        - { name: status, in: query, schema: { enum: [open, resolved] } }
      responses:
        "200":
          description: Diagnóstico
          content:
            application/json:
              schema: { $ref: "schemas/diagnostics.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /admin/diagnostics/export:
    get:
      tags: [admin]
      operationId: exportDiagnostics
      summary: Pacote para anexar num chamado (zip com registros, versão e configuração sem segredos)
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pacote
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /admin/diagnostics/{signature}:
    get:
      tags: [admin]
      operationId: getDiagnostic
      summary: Pilha de chamadas e linha do tempo de um grupo de erros
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
        - { name: signature, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Grupo e ocorrências
          content:
            application/json:
              schema: { $ref: "schemas/diagnostic-detail.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /admin/diagnostics/{signature}/resolve:
    post:
      tags: [admin]
      operationId: resolveDiagnostic
      summary: Marcar um grupo de erros como resolvido
      description: Volta a ficar aberto se o erro ocorrer de novo depois da resolução.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
        - { name: signature, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Grupo resolvido
          content:
            application/json:
              schema: { $ref: "schemas/diagnostic-detail.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /session/exchange:
    post:
      tags: [system]
      operationId: exchangeSessionCode
      summary: Trocar o código de uso único pelo token (programa desktop no navegador)
      security: []
      description: |
        Quando a janela do programa não abre (sem WebView2), a interface abre no navegador
        padrão com um código de uso único no fragmento da URL (`#code=...`), que não vai para
        o servidor nem para o log. A interface troca o código pelo token desta abertura. Cada
        código vale uma vez e por 2 minutos. Só existe no programa desktop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/session-exchange-request.schema.json" }
      responses:
        "200":
          description: Token desta abertura
          content:
            application/json:
              schema: { $ref: "schemas/session-token.schema.json" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /session:
    get:
      tags: [system]
      operationId: getSession
      summary: Quem está usando o motor
      description: |
        No programa desktop (`os_session` em `/health`), o revisor é o usuário do Windows e
        a interface não mostra tela de entrada. Fora dele, `reviewer` vem vazio e a interface
        pede o nome.
      responses:
        "200":
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: "schemas/session.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /batches:
    get:
      tags: [batches]
      operationId: listBatches
      summary: Listar lotes
      responses:
        "200":
          description: Lotes, do mais recente ao mais antigo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/batch-status.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [batches]
      operationId: createBatch
      summary: Enviar um lote
      description: |
        Envia as imagens do lote (pasta arrastada para o navegador: o nome de cada parte é o
        caminho relativo) ou um único `.zip`. A análise roda em segundo plano; acompanhe por
        `GET /batches/{id}` ou `GET /batches/{id}/events`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                profile_id: { type: string, default: demo }
                name: { type: string }
                manifest:
                  type: string
                  format: binary
                  description: CSV com colunas `document,pages` (contagem declarada)
                numbering:
                  type: string
                  format: binary
                  description: numbering.json (schemas/numbering-sidecar.schema.json)
      responses:
        "202":
          description: Lote recebido e na fila
          content:
            application/json:
              schema: { $ref: "schemas/batch-status.schema.json" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/Problem" }
  /demo-batches:
    get:
      tags: [batches]
      operationId: listDemoBatches
      summary: Lotes de demonstração prontos no servidor
      description: Gerados no build da imagem com `tools/synth` (ADR-0010). O gabarito não é exposto.
      responses:
        "200":
          description: Lotes disponíveis (vazio se `QA_DEMO_DIR` não estiver configurado)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/demo-batch.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /demo-batches/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [batches]
      operationId: startDemoBatch
      summary: Analisar um lote de demonstração (sem enviar arquivos)
      description: Copia o lote para um lote novo e o põe na fila, como `POST /batches`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "schemas/demo-batch-request.schema.json" }
      responses:
        "202":
          description: Lote na fila
          content:
            application/json:
              schema: { $ref: "schemas/batch-status.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /local-batches:
    post:
      tags: [batches]
      operationId: openLocalBatch
      summary: Abrir um lote numa pasta local ou de rede (só no programa desktop)
      description: |
        Lê o lote no lugar, só para leitura: nada é copiado nem alterado na pasta original.
        Recusado (403) fora de `allowed_roots`; 404 se a pasta não existe; 422 se não é uma
        pasta ou não tem imagens. Antes de analisar, espera `batch_settle_seconds` sem
        nenhum arquivo mudar e tira um retrato (tamanho, data e SHA-256 de cada arquivo).
        Se a pasta mudar durante a revisão, salvar o lote corrigido é recusado (409).
        Só existe quando o motor roda como programa desktop (`mode` em `/health`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/local-batch-request.schema.json" }
      responses:
        "202":
          description: Lote na fila
          content:
            application/json:
              schema: { $ref: "schemas/batch-status.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [batches]
      operationId: getBatch
      summary: Estado, progresso e veredito
      responses:
        "200":
          description: Estado do lote
          content:
            application/json:
              schema: { $ref: "schemas/batch-status.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/events:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [batches]
      operationId: streamBatchEvents
      summary: Progresso em tempo real (Server-Sent Events)
      description: |
        Cada evento `progress` traz um BatchStatus em JSON; o fluxo termina com `done`.
        Liberação por processo: `document_ready` sai uma vez para cada processo que fica
        pronto para conferir, com `id`, `name`, `ready` (quantos prontos) e `pending`
        (quantos faltam).
      responses:
        "200":
          description: Fluxo de eventos
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/report:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [batches]
      operationId: getBatchReport
      summary: Resultado completo, com as decisões registradas
      responses:
        "200":
          description: Relatório
          content:
            application/json:
              schema: { $ref: "schemas/analysis.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/findings:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [review]
      operationId: listFindings
      summary: Sinalizações filtradas por severidade, regra e pendência
      parameters:
        - name: severity
          in: query
          schema:
            type: array
            items: { enum: [critical, high, medium, low] }
          style: form
          explode: true
        - name: rule
          in: query
          schema:
            type: array
            items: { type: string, pattern: "^[a-z0-9_]+$" }
          style: form
          explode: true
        - name: pending
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Sinalizações, da mais grave à menos grave
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/finding.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /findings/{finding_id}/decision:
    parameters:
      - name: finding_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      operationId: decideFinding
      summary: Aprovar, corrigir, reprovar ou marcar defeito de origem
      description: |
        `correct` numa correção automática de imagem gera uma cópia corrigida (o original
        nunca é alterado), reanalisa a cópia e registra a aplicação no log do lote.
        Toda decisão também entra no histórico usado para calibrar os detectores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/decision-request.schema.json" }
      responses:
        "200":
          description: Sinalização com a decisão registrada
          content:
            application/json:
              schema:
                type: object
                required: [finding, summary]
                properties:
                  finding: { $ref: "schemas/finding.schema.json" }
                  summary: { $ref: "schemas/batch-summary.schema.json" }
                  applied:
                    type: object
                    description: Presente quando a correção foi aplicada numa cópia
                    required: [output, output_sha256, remaining_rules]
                    properties:
                      output: { type: string }
                      output_sha256: { type: string }
                      remaining_rules: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [review]
      operationId: undoDecision
      summary: Desfazer a última decisão (Ctrl+Z)
      description: |
        Remove a decisão vigente da sinalização e registra "undo" no histórico. Uma cópia
        corrigida já gerada é mantida (o log de correções é só de inserção).
      responses:
        "200":
          description: Sinalização sem decisão e painel recalculado
          content:
            application/json:
              schema:
                type: object
                required: [finding, summary]
                properties:
                  finding: { $ref: "schemas/finding.schema.json" }
                  summary: { $ref: "schemas/batch-summary.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/bulk-corrections:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    post:
      tags: [corrections]
      operationId: startBulkCorrection
      summary: Corrigir tudo (documento ou lote inteiro)
      description: |
        Decide `correct` em todas as sinalizações PENDENTES com correção automática do escopo:
        correções de imagem (aplicadas numa cópia), remoção de página em branco e reordenação
        pela numeração. Página faltando, defeitos que exigem redigitalização e o que pede
        decisão humana ficam pendentes e voltam em `result.skipped`. Roda em segundo plano;
        acompanhe o progresso real em `GET /bulk-corrections/{operation_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/bulk-correction-request.schema.json" }
      responses:
        "202":
          description: Operação na fila
          content:
            application/json:
              schema: { $ref: "schemas/bulk-correction.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [corrections]
      operationId: listBulkCorrections
      summary: Operações de correção em lote do lote, da mais recente à mais antiga
      responses:
        "200":
          description: Operações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/bulk-correction.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /bulk-corrections/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [corrections]
      operationId: getBulkCorrection
      summary: Progresso e resultado de uma correção em lote
      responses:
        "200":
          description: Estado da operação (progresso em páginas e documentos corrigidos)
          content:
            application/json:
              schema: { $ref: "schemas/bulk-correction.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [corrections]
      operationId: undoBulkCorrection
      summary: Desfazer em lote só o que esta operação aplicou
      description: |
        Remove as decisões que ainda carregam o `operation_id` desta operação (uma decisão
        trocada depois, individualmente, não é tocada), recalcula as versões corrigidas das
        páginas e registra "undo" no histórico.
      parameters:
        - name: reviewer
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Operação desfeita e painel recalculado
          content:
            application/json:
              schema: { $ref: "schemas/bulk-correction.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/corrected-plan:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [corrections]
      operationId: getCorrectedPlan
      summary: Como o lote corrigido vai ficar com as decisões atuais
      description: |
        Ordem final, páginas removidas e o motivo, correções aplicadas, páginas que precisam
        ser redigitalizadas e páginas faltando com a decisão tomada. `can_save` é falso
        enquanto houver página faltando sem decisão.
      responses:
        "200":
          description: Plano do lote corrigido
          content:
            application/json:
              schema: { $ref: "schemas/corrected-plan.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/corrected-batch:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    post:
      tags: [corrections]
      operationId: saveCorrectedBatch
      summary: Salvar correções e gerar o lote corrigido (.zip ou pasta)
      description: |
        Confirma as operações de correção ainda não salvas e gera o lote corrigido:
        `exports/lote-corrigido.zip` ou, com `destination: folder`, a pasta
        `output_dir/<lote>-corrigido-<data-hora>`, gravada num temporário e renomeada só
        quando termina (nunca fica uma pasta pela metade com o nome final). Mesma estrutura de pastas, ordem final, páginas
        removidas fora, versão corrigida mais recente, arquivos renumerados (0001.tif...),
        TIFF com compressão sem perda (Deflate) e DPI do original, mais `manifest.json`
        (schemas/corrected-manifest.schema.json), `manifest.csv`, `report.json`,
        `findings.csv` e `decisions.csv` (registro de decisões). O original nunca é
        alterado. Recusado (409) enquanto houver página faltando sem decisão ou se a pasta
        original de um lote local mudou desde a análise.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/corrected-batch-request.schema.json" }
      responses:
        "201":
          description: Lote corrigido gerado
          content:
            application/json:
              schema: { $ref: "schemas/corrected-batch.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /pages/{page_id}/image:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - name: variant
        in: query
        schema: { enum: [original, corrected], default: original }
      - name: max_width
        in: query
        description: Largura máxima em pixels (miniaturas e telas); omitido = resolução original
        schema: { type: integer, minimum: 16, maximum: 10000 }
    get:
      tags: [pages]
      operationId: getPageImage
      summary: Imagem da página, original ou corrigida
      description: |
        `corrected` devolve a versão corrigida mais recente (todas as correções de imagem
        decididas, aplicadas sobre o original em ordem canônica); 404 se a página não tem
        correção. Tiles para zoom profundo entram numa versão menor seguinte.
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /pages/{page_id}/numbering-crop:
    parameters: [{ $ref: "#/components/parameters/PageId" }]
    get:
      tags: [pages]
      operationId: getNumberingCrop
      summary: Recorte da região onde a numeração foi lida
      description: |
        Região do canto (vista de pé, 150 dpi) onde o leitor por imagem achou a numeração
        de folha, para o revisor conferir na tela de Sequência. 404 quando a numeração veio
        de `numbering.json` ou a página não foi lida.
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/box-reports:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    get:
      tags: [reports]
      operationId: listBoxReports
      summary: Relatórios por caixa do lote (todas as versões)
      responses:
        "200":
          description: Versões, da mais antiga para a mais nova, por caixa
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, report]
                  properties:
                    id: { type: string }
                    report: { $ref: "schemas/box-report.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [reports]
      operationId: generateBoxReports
      summary: Gerar o relatório das caixas concluídas
      description: |
        Para cada caixa com todas as decisões tomadas, grava o relatório (JSON e PDF) na
        pasta de saída e, com `reports_dir`, na pasta compartilhada. Só sai uma versão nova
        quando as pendências mudaram desde a última. Salvar o lote corrigido faz o mesmo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer]
              additionalProperties: false
              properties:
                reviewer: { type: string, minLength: 1 }
      responses:
        "200":
          description: Versões geradas agora (vazio se nada mudou ou nenhuma caixa está concluída)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, report]
                  properties:
                    id: { type: string }
                    report: { $ref: "schemas/box-report.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /management:
    get:
      tags: [reports]
      operationId: getManagement
      summary: Gestão (relatórios por caixa de todas as máquinas)
      description: |
        Lê os relatórios por caixa de `reports_dir` (todas as máquinas) ou, sem ela, os
        deste computador. Uma caixa entra no período em que foi concluída; o estado é o da
        versão mais nova até o fim do período. Arquivos ilegíveis ou fora do contrato são
        pulados e contados em `source.skipped`.
      parameters:
        - name: since
          in: query
          description: Início do período (inclusive), ISO 8601
          schema: { type: string }
        - name: until
          in: query
          description: Fim do período (exclusive), ISO 8601
          schema: { type: string }
      responses:
        "200":
          description: Visão da Gestão
          content:
            application/json:
              schema: { $ref: "schemas/management.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Problem" }
  /management/report.pdf:
    get:
      tags: [reports]
      operationId: getManagementReportPdf
      summary: PDF de um relatório por caixa da Gestão
      parameters:
        - name: ref
          in: query
          required: true
          description: O `ref` do item na resposta de /management
          schema: { type: string }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /box-reports/{report_id}.pdf:
    parameters:
      - name: report_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [reports]
      operationId: getBoxReportPdf
      summary: PDF de uma versão do relatório por caixa
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /pages/{page_id}/rotation:
    parameters: [{ $ref: "#/components/parameters/PageId" }]
    put:
      tags: [review]
      operationId: setPageRotation
      summary: Girar a página na cópia (rotação escolhida pelo revisor)
      description: |
        Giro horário total. Vira uma decisão auditada numa sinalização `orientation`: a do
        modelo, se houver (a rotação proposta passa a ser a escolhida), ou uma nova. A cópia
        corrigida é regravada e vai para o lote corrigido. `angle_deg: 0` aprova a
        sinalização existente (não girar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/rotation-request.schema.json" }
      responses:
        "200":
          description: Sinalização decidida e painel do lote
          content:
            application/json:
              schema:
                type: object
                required: [finding, summary]
                properties:
                  finding: { $ref: "schemas/finding.schema.json" }
                  summary: { $ref: "schemas/batch-summary.schema.json" }
                  applied: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /pages/{page_id}/numbering:
    parameters: [{ $ref: "#/components/parameters/PageId" }]
    put:
      tags: [pages]
      operationId: putPageNumbering
      summary: Confirmar ou corrigir a numeração lida (tecla N)
      description: Ressolve a sequência do documento com o valor digitado e recalcula as sinalizações de sequência.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/numbering-update.schema.json" }
      responses:
        "200":
          description: Numeração do documento depois da correção
          content:
            application/json:
              schema:
                type: object
                required: [pages, summary]
                properties:
                  pages:
                    type: object
                    additionalProperties: { $ref: "schemas/numbering.schema.json" }
                  summary: { $ref: "schemas/batch-summary.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/documents/{document_id}/numbering:
    parameters:
      - $ref: "#/components/parameters/BatchId"
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [review]
      operationId: putDocumentNumbering
      summary: Numeração digitada e ordem das páginas de um documento (tela de Sequência)
      description: |
        Grava a numeração digitada de uma ou mais páginas (null desfaz) e, se vier, a ordem
        escolhida pelo revisor (null desfaz). A sequência do documento é resolvida de novo,
        na ordem manual quando houver: estado, ordem proposta, lacunas e sinalizações de
        sequência recalculados. A ordem manual vale sobre a proposta no lote corrigido.
        Tudo é validado antes de gravar: valor que não é folha, página de outro documento
        ou ordem que não seja uma permutação das páginas dão 422 sem mudar nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/document-numbering-update.schema.json" }
      responses:
        "200":
          description: Documento depois da mudança
          content:
            application/json:
              schema: { $ref: "schemas/document-numbering.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/documents/{document_id}/pages:
    parameters:
      - $ref: "#/components/parameters/BatchId"
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      operationId: insertDocumentPage
      summary: Inserir uma folha que apareceu depois (arrastar para a Sequência)
      description: |
        Guarda a folha na área de complementos do lote (nunca na pasta original), analisa
        com as regras do lote (linha de base gravada) e lê o número. Entra na posição
        enviada ou, sem ela, na sugerida pelo número lido. A sequência é resolvida de novo
        (a lacuna fecha) e o relatório da caixa sai em versão nova se a caixa estava
        concluída. Uma folha por arquivo. Só depois da análise da caixa.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, reviewer]
              properties:
                file: { type: string, format: binary }
                reviewer: { type: string, minLength: 1 }
                position: { type: integer, minimum: 1, description: "Posição no processo (1 = antes da primeira); sem ela, a sugerida pelo número" }
      responses:
        "201":
          description: Processo com a folha nova
          content:
            application/json:
              schema: { $ref: "schemas/page-insert-result.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/documents/{document_id}/pages/{page_id}:
    parameters:
      - $ref: "#/components/parameters/BatchId"
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/PageId"
    delete:
      tags: [review]
      operationId: removeDocumentPage
      summary: Desfazer a inserção de uma folha
      description: Só folhas inseridas depois. A auditoria (quem inseriu e quem removeu) fica.
      parameters:
        - name: reviewer
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Processo sem a folha
          content:
            application/json:
              schema: { $ref: "schemas/document-numbering.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /documents/{document_id}/metadata:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [batches]
      operationId: getDocumentMetadata
      summary: Metadados com fonte e confiança
      responses:
        "200":
          description: Metadados do documento
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/metadata-field.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /documents/{document_id}/metadata/{name}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9_]+$" }
    put:
      tags: [batches]
      operationId: putMetadataField
      summary: Confirmar ou corrigir um metadado (tela 7)
      description: O valor passa a ter fonte `reviewer`, confiança 1 e `confirmed = true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/metadata-update.schema.json" }
      responses:
        "200":
          description: Metadados do documento atualizados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/metadata-field.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/exports:
    parameters: [{ $ref: "#/components/parameters/BatchId" }]
    post:
      tags: [batches]
      operationId: createExports
      summary: Gerar relatório, CSVs, JSON de metadados e ordem de retrabalho
      responses:
        "201":
          description: Arquivos gerados
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /batches/{batch_id}/exports/{name}:
    parameters:
      - $ref: "#/components/parameters/BatchId"
      - name: name
        in: path
        required: true
        schema:
          enum: [report.json, findings.csv, metadata.csv, rework_order.csv, lote-corrigido.zip]
    get:
      tags: [batches]
      operationId: getExport
      summary: Baixar um arquivo exportado
      responses:
        "200":
          description: Arquivo
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: Listar perfis
      responses:
        "200":
          description: Perfis disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "schemas/profile.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /profiles/{profile_id}/rules:
    get:
      tags: [profiles]
      operationId: getProfileRules
      summary: Regras do perfil para uma estação, com a origem de cada valor
      parameters:
        - { name: profile_id, in: path, required: true, schema: { type: string } }
        - name: station_id
          in: query
          required: false
          description: Estação; ausente = o perfil inteiro.
          schema: { type: string }
      responses:
        "200":
          description: Regras efetivas
          content:
            application/json:
              schema: { $ref: "schemas/profile-rules.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9_-]+$" }
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Ler um perfil
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "schemas/profile.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [profiles]
      operationId: putProfile
      summary: Criar ou atualizar um perfil (validado contra o esquema)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/profile.schema.json" }
      responses:
        "200":
          description: Perfil salvo
          content:
            application/json:
              schema: { $ref: "schemas/profile.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Token de acesso (variável QA_API_TOKEN no servidor). Na demonstração o motor roda
        sem token e a interface pede só o nome do revisor; com QA_API_TOKEN definido, as
        rotas da API exigem o token e a interface passa a pedi-lo (ADR-0010).
  parameters:
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageId:
      name: page_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Problem:
      type: object
      description: RFC 9457 (Problem Details)
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        problems:
          type: array
          description: Valores recusados, um por chave (configuração inválida).
          items:
            type: object
            required: [key, source, expected]
            properties:
              key: { type: string }
              source: { type: string }
              expected: { type: string }
              value: {}
  responses:
    Problem:
      description: Erro
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
