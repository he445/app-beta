repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (estrito)
        entry: bash -c "cd engine && uv run mypy"
        language: system
        pass_filenames: false
        files: ^engine/
