name: Windows

# Programa desktop: testes e conformidade em Windows, build com PyInstaller, teste de fumaça
# do executável e zip com SHA-256 (ADR-0011). Roda em tag de versão, à mão e quando muda o
# que afeta o pacote.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - deploy/windows/**
      - engine/src/qa_engine/entrypoints/desktop/**
      - engine/src/qa_engine/adapters/**
      - engine/pyproject.toml
      - engine/uv.lock
      - models.lock.json
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - deploy/windows/**
      - engine/**
      - ui/**
      - .github/workflows/windows.yml
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a versão (cria a tag v<versão> neste commit e a Release com o pacote); só na main"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Testes, build e teste de fumaça (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # só o passo da tag v* usa: publicar a versão com o pacote
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Fontes DejaVu (lotes sintéticos)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "dejavu.zip"
          Invoke-WebRequest "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "QA_SYNTH_FONT_DIR=$env:RUNNER_TEMP\dejavu-fonts-ttf-2.37\ttf" >> $env:GITHUB_ENV
      - name: Dependências (com janela e PyInstaller)
        working-directory: engine
        run: uv sync --frozen --python 3.12 --extra desktop --group build
      - uses: actions/cache@v4
        with:
          path: models
          key: modelos-windows-${{ hashFiles('models.lock.json') }}
      - name: Modelos (conferidos pelo SHA-256)
        working-directory: engine
        run: uv run python ../tools/models/fetch.py --out ../models
      - name: Testes do motor em Windows
        working-directory: engine
        run: uv run pytest -m "not conformance"
      - name: Conformidade em Windows
        working-directory: engine
        run: uv run pytest -m conformance
      - name: Build, teste de fumaça e zip
        run: ./deploy/windows/build.ps1
      - name: Programa sem janela responde e a segunda abertura não sobe outro motor
        run: |
          $exe = Get-ChildItem build/dist -Recurse -Filter QA-suporte.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "headless.log"
          $p = Start-Process $exe.FullName -ArgumentList "--headless" -RedirectStandardOutput $log -PassThru
          for ($i = 0; $i -lt 60 -and -not (Select-String -Path $log -Pattern "^motor em" -Quiet); $i++) { Start-Sleep 1 }
          $url = ((Select-String -Path $log -Pattern "^motor em (.*)$").Matches[0].Groups[1].Value)
          $health = Invoke-RestMethod "$url/health"
          if ($health.mode -ne "desktop") { throw "modo errado: $($health.mode)" }
          $second = Start-Process $exe.FullName -ArgumentList "--headless" -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw "segunda abertura saiu com $($second.ExitCode)" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: QA-SOS-Docs-windows
          path: |
            build/dist/*.zip
            build/dist/*.zip.sha256
      - name: Publicar a versão (tag v*, ou à mão na main) com o zip e o SHA-256
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (uv run --project engine python -c "import qa_engine; print(qa_engine.__version__)").Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($tag -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME não bate com a versão $version do programa" }
            $where = @("--verify-tag")
          } else {
            # Disparo à mão na main: a tag nasce aqui, neste commit (testado acima).
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { throw "a versão $tag já foi publicada; suba a versão antes de publicar de novo" }
            $global:LASTEXITCODE = 0
            $where = @("--target", $env:GITHUB_SHA)
          }
          $files = Get-ChildItem build/dist -File | Where-Object { $_.Name -like "*.zip" -or $_.Name -like "*.zip.sha256" } | ForEach-Object { $_.FullName }
          $notes = Join-Path $env:RUNNER_TEMP "notas.md"
          @"
          Pacote portátil para Windows 10 e 11 (64 bits): extraia o zip numa pasta com permissão de escrita e abra ``QA.exe``. Não precisa de administrador nem de internet.

          - Confira o arquivo com o ``.sha256`` (``Get-FileHash -Algorithm SHA256 <zip>``); é o hash que a TI usa para liberar o programa no antivírus.
          - O executável não tem assinatura digital: o SmartScreen avisa (Mais informações → Executar assim mesmo).
          - Leia ``LEIA-ME.txt``; a documentação completa está em ``docs\index.html`` dentro do pacote. Para treinar: ``samples\lote-exemplo`` e o manual do conferente.
          - O que mudou: [CHANGELOG](https://github.com/$env:GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md).
          "@ | Set-Content $notes -Encoding utf8
          gh release create $tag @files @where --title "QA de Digitalização $version" --notes-file $notes
