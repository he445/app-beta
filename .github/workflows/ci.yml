name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Motor (lint, tipos, testes, conformidade)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Fontes da base sintética
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: uv sync --frozen --extra desktop
      - uses: actions/cache@v4
        with:
          path: models
          key: modelos-${{ hashFiles('models.lock.json') }}
      - name: Modelos (conferidos pelo SHA-256; a conformidade usa a orientação)
        run: uv run python ../tools/models/fetch.py --out ../models
      - run: uv run ruff check . ../tools ../conformance
      - run: uv run ruff format --check . ../tools ../conformance
      - run: uv run mypy
      - name: Testes (inclui documentação obrigatória e arquitetura)
        run: uv run pytest -m "not conformance"
      - name: Suíte de conformidade
        run: uv run pytest -m conformance

  ui:
    name: Interface (tipos do contrato, typecheck, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Tipos gerados em dia com o contrato
        run: npm run gen && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  celular:
    name: Celular (Pixel 7 e iPhone 13, motor servindo a interface)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Fontes do lote de demonstração
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: uv sync --frozen --project engine
      - name: Lote de demonstração (tools/synth showcase)
        run: uv run --project engine python tools/synth/synth.py showcase --out "$RUNNER_TEMP/demo/lote-demonstracao"
      - name: Interface na mesma origem e navegador
        working-directory: ui
        run: |
          npm ci
          VITE_API_URL= npm run build
          npx playwright install --with-deps chromium
      - name: Motor servindo a interface
        working-directory: engine
        run: |
          QA_DATA_DIR="$RUNNER_TEMP/data" QA_UI_DIR="$GITHUB_WORKSPACE/ui/dist" \
          QA_DEMO_DIR="$RUNNER_TEMP/demo" QA_WORKERS=1 \
            nohup uv run python -m qa_engine.entrypoints.http > "$RUNNER_TEMP/motor.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/motor.log"; exit 1
      - name: Fluxo de demonstração no celular
        working-directory: ui
        run: |
          mkdir -p "$RUNNER_TEMP/capturas"
          npm run e2e:celular -- http://localhost:8000/ "Pixel 7" "$RUNNER_TEMP/capturas"
          npm run e2e:celular -- http://localhost:8000/ "iPhone 13" "$RUNNER_TEMP/capturas"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celular-capturas
          path: |
            ${{ runner.temp }}/capturas/*.png
            ${{ runner.temp }}/motor.log

  desktop:
    name: Programa desktop sem janela (abrir pasta, analisar, salvar em pasta)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Fontes do lote de exemplo
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: uv sync --frozen --project engine
      - name: Interface compilada (servida pelo próprio programa)
        working-directory: ui
        run: |
          npm ci
          VITE_API_URL= npm run build
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: models
          key: modelos-${{ hashFiles('models.lock.json') }}
      - name: Modelos (conferidos pelo SHA-256)
        run: uv run --project engine python tools/models/fetch.py --out models
      - name: Lote de exemplo numa pasta com acento e espaço
        run: uv run --project engine python tools/synth/synth.py showcase --out "$RUNNER_TEMP/Lotes/Caixa 0412"
      - name: Lote de três folhas sem número (tela de Sequência)
        run: uv run --project engine python tools/synth/numbering.py sequencia --out "$RUNNER_TEMP/Lotes/Sequência 01"
      - name: Programa sem janela e fluxo no navegador
        env:
          HOME: ${{ runner.temp }}/home
          QA_BATCH_SETTLE_SECONDS: "1"
          QA_WORKERS: "2"
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/capturas"
          # Configuração da máquina numa pasta temporária, com token de administrador.
          export XDG_CONFIG_DIRS="$RUNNER_TEMP/maquina"
          admin=$(cd engine && uv run qa admin token --config "$XDG_CONFIG_DIRS/QA/config.toml" | sed -n 2p)
          (cd engine && nohup uv run python -m qa_engine.entrypoints.desktop --headless > "$RUNNER_TEMP/desktop.log" 2>&1 &)
          for i in $(seq 1 60); do grep -q '^acesso:' "$RUNNER_TEMP/desktop.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/desktop.log"
          link=$(grep '^acesso:' "$RUNNER_TEMP/desktop.log" | awk '{print $2}')
          cd ui && npm run e2e:desktop -- "$link" "$RUNNER_TEMP/Lotes/Caixa 0412" "$RUNNER_TEMP/capturas" "$admin" "$RUNNER_TEMP/Lotes/Sequência 01"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-capturas
          path: |
            ${{ runner.temp }}/capturas/*.png
            ${{ runner.temp }}/desktop.log

  contract:
    name: Contrato (Spectral + oasdiff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Spectral
        run: npx -y @stoplight/spectral-cli@6.14.2 lint contracts/openapi.yaml --ruleset .spectral.yaml --fail-severity error
      - name: oasdiff (quebra exige versão maior)
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/openapi.yaml" 2>/dev/null; then
            git worktree add /tmp/base "origin/${{ github.base_ref }}"
            docker run --rm -v /tmp/base:/base -v "$PWD":/head tufin/oasdiff:v1.10.25 \
              breaking /base/contracts/openapi.yaml /head/contracts/openapi.yaml --fail-on ERR \
              || python3 contracts/check_major_bump.py /tmp/base/contracts/openapi.yaml contracts/openapi.yaml
          else
            echo "Sem contrato na base: nada a comparar."
          fi

  docs:
    name: Documentação (checagens, lint e mkdocs --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen --project engine
      - name: Links, referência gerada em dia e documentação só em docs/
        run: uv run --project engine python tools/docs/check_docs.py
      - name: Lint de Markdown
        run: npx -y markdownlint-cli2@0.14.0
      - run: uvx --with mkdocs-material==9.5.44 --with "mkdocstrings[python]==0.27.0" --with pymdown-extensions==10.12 mkdocs==1.6.1 build --strict

  docker:
    name: Imagem do motor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t qa-digitalizacao:ci .
      - name: Fumaça (saúde, interface na mesma origem e lote de demonstração)
        run: |
          docker run -d --name qa -p 8000:8000 qa-digitalizacao:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          curl -fsS localhost:8000/demo-batches | grep -q lote-demonstracao
          curl -fsS localhost:8000/health | grep -q '"auth_required":false' || { docker logs qa; exit 1; }
