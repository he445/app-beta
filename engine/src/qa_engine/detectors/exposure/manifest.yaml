id: exposure
version: 1.0.0
title: Escura, clara ou sem contraste
spec: docs/especificacoes/detectors/exposure.md
input: page_gray_150dpi
target: page
severity: high
params:
  z_threshold: { type: number, default: 2.0, minimum: 0, description: "Desvios robustos da mediana do lote para sinalizar" }
  min_batch_size: { type: integer, default: 5, minimum: 1, description: "Páginas elegíveis necessárias para usar a mediana do lote" }
  min_ink_pixels: { type: integer, default: 500, minimum: 1, description: "Pixels de tinta mínimos para medir contraste" }
  min_sigma_paper: { type: number, default: 8.0, minimum: 0.1, description: "Piso do desvio do brilho do papel, em níveis de cinza" }
  min_sigma_contrast: { type: number, default: 15.0, minimum: 0.1, description: "Piso do desvio do contraste, em níveis de cinza" }
  reference_paper: { type: number, default: 240.0, minimum: 0, maximum: 255, description: "Brilho de papel de referência para lote pequeno" }
  reference_contrast: { type: number, default: 190.0, minimum: 0, maximum: 255, description: "Contraste de referência para lote pequeno" }
output: finding
