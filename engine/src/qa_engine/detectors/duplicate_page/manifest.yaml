id: duplicate_page
version: 1.1.0
title: Página duplicada
spec: docs/especificacoes/detectors/duplicate_page.md
input: batch_pages
target: page
severity: medium
params:
  max_hash_distance: { type: integer, default: 80, minimum: 0, maximum: 256, description: "Distância de Hamming máxima entre dHash de 256 bits para virar candidato (a redigitalização girada até 3° chega a 72)" }
  min_similarity: { type: number, default: 0.96, minimum: 0, maximum: 1, description: "Semelhança mínima depois do alinhamento (giro e deslocamento) para confirmar a duplicata" }
  candidate_min_similarity: { type: number, default: 0.6, minimum: 0, maximum: 1, description: "Correlação mínima das miniaturas sem alinhar para o par ir à comparação alinhada" }
  max_ink_difference: { type: number, default: 0.01, minimum: 0, maximum: 1, description: "Fração máxima do traço de uma página sem traço da outra, depois de alinhar (formulário repetido com preenchimento diferente não é duplicata)" }
  sharpness_margin: { type: number, default: 0.8, minimum: 0, maximum: 1, description: "Razão de nitidez acima da qual sai a segunda ocorrência; abaixo, sai a menos nítida" }
  numbering_veto_confidence: { type: number, default: 0.85, minimum: 0, maximum: 1, description: "Confiança mínima das leituras de número de folha das duas páginas para números diferentes vetarem o par" }
  min_ink_coverage: { type: number, default: 0.002, minimum: 0, maximum: 1, description: "Páginas com menos tinta não vão à comparação alinhada (cópia exata é achada pelo hash do raster)" }
output: finding
