id: skew
version: 1.3.0
title: Inclinação
spec: docs/especificacoes/detectors/skew.md
input: page_gray_150dpi
target: page
severity: medium
params:
  flag_threshold: { type: number, default: 0.5, minimum: 0, description: "Ângulo absoluto, em graus, acima do qual a página é sinalizada" }
  reject_threshold: { type: number, default: 3.0, minimum: 0, description: "Ângulo absoluto acima do qual a severidade sobe para alto" }
  max_angle: { type: number, default: 10.0, minimum: 1, maximum: 45, description: "Faixa de busca, em graus, para cada lado" }
  min_ink_coverage: { type: number, default: 0.01, minimum: 0, maximum: 1, description: "Cobertura mínima para estimar o ângulo" }
  min_flag_confidence: { type: number, default: 0.1, minimum: 0, maximum: 1, description: "Confiança abaixo da qual a inclinação não é sinalizada: o ângulo achado pontua igual a 0°" }
  min_auto_confidence: { type: number, default: 0.3, minimum: 0, maximum: 1, description: "Confiança a partir da qual a correção de inclinação é automática; abaixo, vai para revisão" }
  review_min_ink_coverage: { type: number, default: 0.003, minimum: 0, maximum: 1, description: "Cobertura mínima para medir; entre ela e min_ink_coverage a página tem pouca tinta e só vai para revisão" }
  low_ink_min_angle: { type: number, default: 3.0, minimum: 0, description: "Na página com pouca tinta, ângulo absoluto mínimo, em graus, para sinalizar (com poucas linhas a estimativa é ruidosa em ângulo pequeno)" }
output: finding
