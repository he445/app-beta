[project]
name = "qa-engine"
version = "0.2.0"
description = "Motor de referência do QA automático de digitalização (PoC)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "platformdirs>=4.2",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Janela do programa desktop (WebView2 no Windows). O motor e a CLI não precisam.
desktop = ["pywebview>=6.2"]

[project.scripts]
qa = "qa_engine.entrypoints.cli.main:main"

[project.gui-scripts]
qa-desktop = "qa_engine.entrypoints.desktop.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Só para montar o pacote Windows (deploy/windows): não vai como biblioteca no programa.
build = ["pyinstaller>=6.20"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["conformance: suíte de conformidade (gera o lote core na primeira execução, ~20 s)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D", "PT", "C4"]
ignore = ["D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT018"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["qa_engine"]

[[tool.mypy.overrides]]
# OpenCV devolve MatLike; tratamos as chamadas como Any e tipamos as fronteiras com NDArray.
module = ["cv2", "cv2.*"]
follow_imports = "skip"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "jsonschema.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
